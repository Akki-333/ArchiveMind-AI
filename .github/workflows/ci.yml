# Continuous integration.
#
# Deliberately offline: every credential below is a placeholder. config.py
# raises at import when a required secret is missing, and the Pinecone client
# and Neo4j driver are both lazy, so the app imports cleanly against fake
# values without ever opening a connection. CI therefore needs no repository
# secrets and cannot touch production data.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: test
  JWT_SECRET: ci-only-signing-key-not-a-real-secret
  PINECONE_API_KEY: ci-test-key
  PINECONE_INDEX_NAME: archivemind-test
  NEO4J_URI: bolt://localhost:7687
  NEO4J_USERNAME: neo4j
  NEO4J_PASSWORD: ci-test-password
  GROQ_API_KEY: ci-test-key
  ADMIN_ACCESS_CODE: ci-test-access-code

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run tests
        run: pytest backend/tests -q

      - name: Import smoke test
        # Catches what a unit test cannot: a route that no longer registers, a
        # circular import, an auth dependency accidentally dropped.
        working-directory: backend
        run: |
          python - <<'PY'
          import main

          paths = main.app.openapi()["paths"]
          print(f"{len(paths)} endpoints registered")

          required = [
              "/api/chat",
              "/api/chat/edit",
              "/api/auth/login",
              "/api/auth/me",
              "/api/documents",
              "/api/upload",
              "/api/graph/highlight",
              "/health",
          ]
          missing = [p for p in required if p not in paths]
          assert not missing, f"missing endpoints: {missing}"

          # The probes that cost money must never be anonymous again.
          guarded = {"/health/db", "/health/config"}
          for route in main.app.routes:
              if getattr(route, "path", None) in guarded:
                  assert route.dependant.dependencies, f"{route.path} must require auth"
          print("route contract OK")
          PY

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
